name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  simple_build_linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Get Dependencies
        run: |
          sudo apt-get update
          # tcl/tk + cairo for the build; texlive (latex + dvips) so the default
          # "make" also regenerates the PostScript documentation.  Docs are
          # best-effort — a missing texlive package just falls back to the
          # pre-built PostScript, it does not fail the build.
          sudo apt-get install -y tcl-dev tk-dev libcairo-dev \
            texlive-latex-base texlive-latex-recommended texlive-fonts-recommended
      - name: Build
        run: |
          ./configure
          make prepare
          make -j$(nproc)
      - name: Build Tcl auto-load modules
        # These per-module Tcl shared libraries are real products but are not
        # part of the default target (their modules are not in PROGRAMS), so
        # build them explicitly to keep them from bit-rotting.
        run: |
          for m in lef plot router ext2spice ext2sim; do
            make -C "$m" tcl-main
          done

  standard_build_linux:
    # Non-Tcl "standard" configuration: native magic binary + system GNU
    # readline.  Distinct code paths (MAGIC_WRAPPER off, readline) that the Tcl
    # build above does not exercise.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Get Dependencies
        # X11 + cairo for graphics; readline (the non-Tcl line editor) + its
        # ncurses dependency; texlive for the docs.  NB: package set not validated
        # on the runner -- adjust if the build cannot find a library.
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libcairo-dev libreadline-dev libncurses-dev \
            texlive-latex-base texlive-latex-recommended texlive-fonts-recommended
      - name: Build (non-Tcl / standard)
        run: |
          ./configure --without-tcl --without-opengl
          make prepare
          make -j$(nproc)

  smoketest_linux:
    # Out-of-tree Tcl build in ./build-tmp, then run the headless (-dnull) smoke
    # tests against it via the generated run_magicnull.sh.  This exercises the
    # relocatable/out-of-tree build path (which the in-tree jobs above do not)
    # and confirms the binary actually boots and runs a real extract/export/DRC
    # workflow -- see scripts/smoketest/README.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Get Dependencies
        # tcl/tk + cairo for the build.  No texlive: the smoke build does not
        # need the docs (they are best-effort and fall back to pre-built PS).
        run: |
          sudo apt-get update
          sudo apt-get install -y tcl-dev tk-dev libcairo-dev
      - name: Build out-of-tree (build-tmp)
        run: |
          mkdir build-tmp
          cd build-tmp
          ../configure
          make prepare
          make -j$(nproc)
      - name: Smoke test — startup + features
        run: scripts/smoketest/run.sh startup
      - name: Smoke test — extract/export/DRC workflow
        run: scripts/smoketest/run.sh workflow
      - name: Get X11 headless dependencies
        # Headless X stack for the GUI (-d X11) smoke test: Xvfb (X server),
        # openbox (window manager), xdotool + wmctrl (window tooling, ready for a
        # later interaction step).  All packaged on 24.04/26.04, so no source
        # build is needed; libXtst/libxkbcommon come in as dependencies.  The apt
        # index was already refreshed by "Get Dependencies" above.
        # python3-yaml drives the magictest.py YAML test catalog below.
        run: sudo apt-get install -y xvfb openbox wmctrl xdotool python3-yaml
      - name: Start headless X server (Xvfb + openbox)
        # x11-start.sh writes DISPLAY to $GITHUB_ENV itself, so the GUI step
        # below inherits it (diagnostics go to stderr / the step log).
        run: scripts/smoketest/x11-start.sh
      # Data-driven YAML test catalog (dnull + x11 tests: send/expect, asserts,
      # external validators, and xdotool GUI events).  DISPLAY is set, so the x11
      # tests run here too; without it they would skip rather than fail.
      - name: Run magic YAML test catalog
        run: python3 scripts/smoketest/magictest.py run scripts/smoketest/tests -v
      # Re-run the *same* startup + workflow smoke scripts, but through the real
      # GUI (run_magic.sh -d X11 -noconsole) on the headless Xvfb, so the X11
      # graphics path is exercised with identical inputs.  SMOKE_DEVICE=x11
      # selects the GUI launcher; magic's own -timeout watchdog (120s, allowing
      # for X latency) guards against a stalled GUI.
      - name: Smoke test — startup + features (X11 GUI)
        run: SMOKE_DEVICE=x11 scripts/smoketest/run.sh startup
      - name: Smoke test — extract/export/DRC workflow (X11 GUI)
        run: SMOKE_DEVICE=x11 scripts/smoketest/run.sh workflow
      # Opt-in, non-blocking demo of driving the GUI three ways: 100% scripted,
      # 0% scripted (pure xdotool: paint + File->Quit + dismiss the dialog), and
      # mixed.  continue-on-error because the pure-xdotool paths are WM-timing
      # sensitive -- a hiccup on the headless WM must not fail the build; the log
      # shows what each mode did.  magic's own -timeout keeps it from hanging.
      - name: GUI interaction demo (opt-in, non-blocking)
        continue-on-error: true
        run: scripts/smoketest/gui-interact.sh all
