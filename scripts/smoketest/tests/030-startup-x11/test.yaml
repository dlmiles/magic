name: startup-x11
description: magic boots under -d X11 on a headless display; a layout window
  appears (checked by the orchestrator) and commands run.
mode: x11
tech: scmos
tags: [x11, smoke]
metadata: {area: startup}
steps:
  # Note the X11 server/WM identity (gated on the detected environment).
  - if: openbox
    echo: "X11 with openbox (Linux headless Xvfb)"
  - if: xquartz
    echo: "X11 with XQuartz (macOS)"
  - name: tech-load
    send: "tech load {tech}"
  - name: tech-name
    # flush stdout: under magicexec (Tk) on macOS Intel, Tcl's stdout is
    # block-buffered, so the puts result is not seen by the orchestrator until
    # flushed; harmless (idempotent) where stdout is already line-buffered.
    send: 'puts "TECHNAME=[tech name]" ; flush stdout'
    expect: "TECHNAME={tech}"
  - name: quit
    send: "quit -noprompt"
expect_exit: 0
